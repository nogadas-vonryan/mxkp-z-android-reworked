plugins {
    id 'com.android.application'
}

// Default to arm64. For a universal ARM APK, prepare dependencies for both ABIs
// and build with -PbuildAbis=arm64-v8a,armeabi-v7a.
def buildAbis = (project.findProperty('buildAbis') ?: 'arm64-v8a')
        .split(',').collect { it.trim() }.findAll { !it.isEmpty() }.unique()
if (buildAbis.isEmpty() || buildAbis.any { !(it in ['arm64-v8a', 'armeabi-v7a']) }) {
    throw new GradleException('buildAbis must contain arm64-v8a and/or armeabi-v7a')
}

android {
    namespace 'com.hatkid.mkxpz'
    compileSdk 33

    defaultConfig {
        applicationId "com.hatkid.mkxpz"
        minSdk 23
        targetSdk 33
        versionCode 11
        versionName "0.1.1"
        archivesBaseName = "mkxp-z-$versionName"
        ndk {
            debugSymbolLevel = 'FULL'
            abiFilters.addAll(buildAbis)
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            debuggable true
            jniDebuggable true
        }
    }

    splits {
        abi {
            enable true
            reset()
            include(*buildAbis)
            universalApk (buildAbis.size() > 1)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        ndkBuild {
            path "jni/Android.mk"
        }
    }
    ndkVersion '23.2.8568313'
}

dependencies {
    implementation 'com.intuit.sdp:sdp-android:1.1.0'
}
